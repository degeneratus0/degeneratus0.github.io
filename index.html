<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>degeneratus:dev — Мобильные игры</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      padding: 32px;
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .header {
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 26px;
      letter-spacing: -0.5px;
    }
    .subtitle {
      margin: 0;
      color: #94a3b8;
      font-size: 15px;
    }
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .game-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #0f172a;
      padding: 14px;
      border-radius: 16px;
      text-decoration: none;
      color: inherit;
      border: 1px solid #334155;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .game-card:hover {
      transform: translateY(-2px);
      border-color: #3b82f6;
    }
    .game-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      background: #1e293b;
    }
    .game-info {
      flex-grow: 1;
    }
    .game-title {
      font-size: 17px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #f8fafc;
    }
    .game-meta {
      font-size: 13px;
      color: #94a3b8;
      margin: 0;
    }
    .badge {
      background: #2563eb;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid #334155;
      font-size: 14px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .footer a {
      color: #60a5fa;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>degeneratus:dev</h1>
      <p class="subtitle">Инди-разработчик мобильных игр для Android</p>
    </div>

    <div class="games-list">
      <!-- Карточка игры -->
      <a class="game-card" href="https://www.rustore.ru/catalog/app/com.degeneratus.dev.jumpyfrog" target="_blank" rel="noopener">
        <img class="game-icon" src="https://static.rustore.ru/2026/3/2/5f/apk/2063673792/content/ICON/5bf29444-c88b-410a-8aca-ef1950d310a0.png" alt="Лягушка Попрыгушка">
        <div class="game-info">
          <div class="game-title">Лягушка Попрыгушка</div>
          <p class="game-meta">Аркада • Раннер • Android</p>
        </div>
        <span class="badge">RuStore</span>
      </a>
    </div>

    <div class="footer">
      <span>Поддержка: <a href="mailto:degeneratus.dev@gmail.com">degeneratus.dev@gmail.com</a></span>    
      <a href="privacy.html">Политика конфиденциальности / Privacy Policy</a>
    </div>
  </div>
</body>
</html>
